name: Deploy Data to Website

on:
  push:
  # Triggers the workflow every time you push changes to your main branch
    branches: [ "main" ]

jobs:
build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script or process data
        run: |
          echo "Running data processing..."
          # Add commands here to run your Python scripts if needed, e.g.:
          # python generate_data.py

      - name: Commit and push changes if website files update
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated data sync" && git push)
